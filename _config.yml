# Site settings
title: "Photoshop for Newcomers"
description: "A comprehensive beginner's guide to Adobe Photoshop"
baseurl: "/Photoshop-Tutorial"
url: "https://turboaristocrat.github.io"

# Theme - Just the Docs (has sidebar navigation)
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

# Color scheme
color_scheme: dark

# Aux links (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/turboaristocrat/Photoshop-Tutorial"

# Footer
footer_content: "Photoshop for Newcomers &copy; 2026"

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
